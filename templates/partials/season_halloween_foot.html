{# Halloween footer art: a graveyard strip on the footer's top rule, with a
   ghost that rises when you scroll down to it (and says boo when tapped),
   and -- desktop only, in the empty gutters -- a spider and a drifting
   ghost.  Only .hw-riser takes pointer events. #}
<div class="hw-yard" aria-hidden="true"><i class="hw-yard-glow"></i>
  <span class="hw-ghost hw-riser"><span class="hw-flee"><span class="hw-bob"><i class="hw-sheet"></i><i class="hw-eye l"></i><i class="hw-eye r"></i><i class="hw-mouth"></i></span></span></span>
  <i class="hw-yard-line"></i><i class="hw-jack j1"></i><i class="hw-jack j2"></i></div>
<div class="hw-fx" aria-hidden="true">
  <span class="hw-spider"><i class="hw-thread"></i><i class="hw-spider-body"></i></span>
  <span class="hw-ghost hw-drifter"><span class="hw-flee"><span class="hw-bob"><i class="hw-sheet"></i><i class="hw-eye l"></i><i class="hw-eye r"></i><i class="hw-mouth"></i></span></span></span></div>
